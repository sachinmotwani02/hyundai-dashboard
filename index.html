<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyundai Quality Control Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header with Logos -->
        <header class="dashboard-header">
            <div class="logo-container">
                <img src="Hyundai.png" alt="Hyundai Logo" class="logo hyundai-logo">
            </div>
            <div class="logo-container">
                <img src="DefectScanner.png" alt="Defect Scanner Logo" class="logo defect-logo">
            </div>
        </header>

        <div class="main-layout">
            <!-- Left Column: Front & Left Side -->
            <div class="left-column">
                <!-- Front View Card -->
                <div class="inspection-card">
                    <div class="card-header">
                        <h2 class="card-title">FRONT</h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="FrontView.svg" alt="Front View" class="car-svg">
                    </div>
                    <div class="checklist-container">
                        <div class="checklist-item">
                            <input type="checkbox" id="headlamp-low" class="checkbox">
                            <label for="headlamp-low">Head Lamp Low</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="headlamp-high" class="checkbox">
                            <label for="headlamp-high">Head Lamp High</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="drl" class="checkbox">
                            <label for="drl">DRL</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="front-fog" class="checkbox">
                            <label for="front-fog">Front Fog</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="turn-signal-front" class="checkbox">
                            <label for="turn-signal-front">Turn Signal</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="license-plate-front" class="checkbox">
                            <label for="license-plate-front">License Plate</label>
                        </div>
                    </div>
                </div>

                <!-- Left Side View Card -->
                <div class="inspection-card">
                    <div class="card-header">
                        <h2 class="card-title">LEFT SIDE</h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="SideView.svg" alt="Left Side" class="car-svg">
                    </div>
                    <div class="checklist-container">
                        <div class="checklist-item">
                            <input type="checkbox" id="door-handle-left" class="checkbox">
                            <label for="door-handle-left">Door Handle</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="repeater-lamp-left" class="checkbox">
                            <label for="repeater-lamp-left">Repeater Lamp</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="wheel-nuts-left" class="checkbox">
                            <label for="wheel-nuts-left">Wheel & Nuts</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="hub-cap-left" class="checkbox">
                            <label for="hub-cap-left">Hub Cap</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="fender-left" class="checkbox">
                            <label for="fender-left">Fender Emblem</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center: Video Grid -->
            <div class="videos-container">
                <div class="video-wrapper">
                    <img src="scene-1.png" alt="Front View" class="vehicle-image">
                </div>
                <div class="video-wrapper">
                    <img src="scene-2.png" alt="Right View" class="vehicle-image">
                </div>
                <div class="video-wrapper">
                    <img src="scene-3.png" alt="Left View" class="vehicle-image">
                </div>
                <div class="video-wrapper">
                    <img src="scene-4.png" alt="Back View" class="vehicle-image">
                </div>
            </div>

            <!-- Right Column: Right Side & Rear -->
            <div class="right-column">
                <!-- Right Side View Card -->
                <div class="inspection-card">
                    <div class="card-header">
                        <h2 class="card-title">RIGHT SIDE</h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="SideView.svg" alt="Right Side" class="car-svg car-svg-flip">
                    </div>
                    <div class="checklist-container">
                        <div class="checklist-item">
                            <input type="checkbox" id="door-handle-right" class="checkbox">
                            <label for="door-handle-right">Door Handle</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="repeater-lamp-right" class="checkbox">
                            <label for="repeater-lamp-right">Repeater Lamp</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="wheel-nuts-right" class="checkbox">
                            <label for="wheel-nuts-right">Wheel & Nuts</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="hub-cap-right" class="checkbox">
                            <label for="hub-cap-right">Hub Cap</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="fender-right" class="checkbox">
                            <label for="fender-right">Fender Emblem</label>
                        </div>
                    </div>
                </div>

                <!-- Rear View Card -->
                <div class="inspection-card">
                    <div class="card-header">
                        <h2 class="card-title">REAR</h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="BackView.svg" alt="Rear View" class="car-svg">
                    </div>
                    <div class="checklist-container">
                        <div class="checklist-item">
                            <input type="checkbox" id="brake-lamp" class="checkbox">
                            <label for="brake-lamp">Brake Lamp</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="reverse-lamp" class="checkbox">
                            <label for="reverse-lamp">Reverse Lamp</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="rear-fog" class="checkbox">
                            <label for="rear-fog">Rear Fog</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="turn-signal-rear" class="checkbox">
                            <label for="turn-signal-rear">Turn Signal</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="license-lamp" class="checkbox">
                            <label for="license-lamp">License Lamp</label>
                        </div>
                        <div class="checklist-item">
                            <input type="checkbox" id="license-plate-rear" class="checkbox">
                            <label for="license-plate-rear">License Plate</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
