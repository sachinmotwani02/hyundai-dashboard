<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyundai Quality Control Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- DEMO Pass Banner (fade-in at top) -->
        <div class="pass-banner" id="pass-banner">&#10003; PASS</div>

        <!-- Header with Logos -->
        <header class="dashboard-header">
            <div class="logo-container">
                <img src="/Hyundai.png" alt="Hyundai Logo" class="logo hyundai-logo">
            </div>
            <div class="logo-container">
                <img src="/DefectScanner.png" alt="Defect Scanner Logo" class="logo defect-logo">
            </div>
        </header>

        <!-- VIN Display -->
        <div class="vin-display" id="vin-display">
            <span class="vin-label">VIN:</span>
            <span class="vin-code" id="vin-code">--</span>
        </div>

        <!-- Persistent Cycle Status Indicator -->
        <div class="cycle-status-banner" id="cycle-status-banner">
            <span class="cycle-status-label">Cycle Status:</span>
            <span class="cycle-status-value" id="cycle-status-value">WAITING</span>
        </div>

        <!-- Booth Selector & Mock Test -->
        <div class="booth-selector-container">
            <div class="mock-test-container">
                <button id="demo-btn" class="mock-test-btn mock-pass">DEMO</button>
            </div>
            <div class="booth-selector">
                <label for="booth-select">Booth:</label>
                <select id="booth-select">
                    <option value="5000" selected>Booth 1</option>
                    <option value="5005">Booth 2</option>
                    <option value="5010">Booth 3</option>
                </select>
            </div>
        </div>

        <div class="main-layout">
            <!-- Left Column: Front Lamps & Left Parts -->
            <div class="left-column">
                <!-- Front View Lamps Card -->
                <div class="inspection-card lamp-card" id="front-lamps-card">
                    <div class="card-header">
                        <h2 class="card-title">FRONT LAMPS</h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="FrontView.svg" alt="Front View" class="car-svg">
                    </div>
                    <!-- Checklist loaded from API -->
                </div>

                <!-- Left Side Parts Card -->
                <div class="inspection-card parts-card" id="left-parts-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" />
                            </svg>
                            PARTS LEFT
                        </h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="SideView.svg" alt="Left Side" class="car-svg">
                    </div>
                    <!-- Checklist loaded from API -->
                </div>
            </div>

            <!-- Center: Video Grid -->
            <div class="videos-container">
                <!-- Videos loaded from API -->
            </div>

            <!-- Right Column: Rear Lamps & Right Parts -->
            <div class="right-column">
                <!-- Rear View Lamps Card -->
                <div class="inspection-card lamp-card" id="rear-lamps-card">
                    <div class="card-header">
                        <h2 class="card-title">REAR LAMPS</h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="BackView.svg" alt="Rear View" class="car-svg">
                    </div>
                    <!-- Checklist loaded from API -->
                </div>

                <!-- Right Side Parts Card -->
                <div class="inspection-card parts-card" id="right-parts-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" />
                            </svg>
                            PARTS RIGHT
                        </h2>
                    </div>
                    <div class="car-svg-container">
                        <img src="SideView.svg" alt="Right Side" class="car-svg car-svg-flip">
                    </div>
                    <!-- Checklist loaded from API -->
                </div>
            </div>
        </div>
    </div>

    <!-- Status Popover (Full Screen) -->
    <div class="status-popover" id="status-popover">
        <div class="popover-content">
            <div class="timer-container" id="timer-container">
                <svg class="timer-svg" viewBox="0 0 100 100">
                    <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                    <circle class="timer-progress" id="timer-progress" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="timer-text" id="timer-text">10</div>
            </div>
            <div class="popover-icon" id="popover-icon"></div>
            <div class="popover-text" id="popover-text"></div>
            <div class="failed-lamps-container" id="failed-lamps-container">
                <div class="failed-lamps-title">FAILED LAMPS</div>
                <div class="failed-lamps-list" id="failed-lamps-list"></div>
            </div>
        </div>
    </div>

    <script src="/script.js?v=rowlock-2"></script>
</body>

</html>
